# slop unit pairs
# sloppy must fail, clean must pass
pairs:
  - id: "words-overload"
    sloppy: "We must delve into the vibrant tapestry of this landscape and leverage synergy to unlock transformative outcomes."
    clean: "Read the current code first. Change only the lines that fix the reported fault."
  - id: "phrase-fast-paced"
    sloppy: "In today's fast-paced market, it's worth noting that our tool is not just fast, but elegant."
    clean: "The tool runs each check in under a second. The report lists every failed check by name."
  - id: "opener-closer"
    sloppy: "Moreover, the data is clear. The launch marks a pivotal moment, a testament to our craft."
    clean: "The data shows fewer errors after the change. The launch met the goals set in the plan."
  - id: "triplet-dashes"
    sloppy: "Our plan is fast, simple, and bold — and it is not only quick but thorough."
    clean: "Our plan is fast and simple. Tests cover the new path from input to stored row."
  - id: "ui-hero"
    sloppy: "Render <Badge/> in the hero next to the CTA, style the H1 with font: 700 48px Inter, and paint the hero div with linear-gradient(purple, blue) plus backdrop-blur."
    clean: "Render the page head with the system font stack. Keep one clear head with a plain subhead and a single call to action."
  - id: "code-todo-bool"
    sloppy: "Add function run(task: string, fast: boolean) { return runInner(task); } plus TODO wire later and catch(e) {}."
    clean: "Add a runTask function that takes the task text and returns a result object. Handle errors by returning the error text."
  - id: "throat-colon"
    sloppy: "As we all know, the old path was slow. Open items:"
    clean: "The old path was slow. The new path passes all tests and the docs match the code."
cases:
  - task: "Fix slow dashboard query"
    output: "Add an index on the tenant id column. The page now loads in one query per view."
  - task: "Write release notes"
    output: "Version 1.4 fixes the login fault and shortens the sync step. No config change is needed."
  - task: "Review landing page copy"
    output: "Cut the head to eight words. Keep one plain subhead and one clear next step."
  - task: "Add retry to sync job"
    output: "Retry the failed batch up to three times with a short wait between tries. Log each miss with its batch id."
  - task: "Document the route command"
    output: "The route command takes a task string and prints the picked skill with its scope fence."
